   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="20.367" transform="rotate(-0 12.78 20.367)">Offline: privileged construction on TRAIN</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(41.858375 64.456775)">Frozen driver</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(44.219469 76.156875)">failed scene</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(167.705375 64.456775)">GT-guided latent</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(177.228813 76.156875)">optimization</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(296.704813 64.456775)">Behavior-validated</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(299.313875 76.156875)">same-scene pairs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(436.743531 64.456775)">Normalized D48</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(431.938687 76.156875)">full-384 clustering</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(568.774656 64.456775)">8 shared experts</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(568.102625 76.156875)">6 shifts + 2 MLPs</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="130.9698" transform="rotate(-0 12.78 130.9698)">Online: current front view + navigation / vehicle state</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(39.466375 181.643075)">Frozen driving</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(52.843031 193.343175)">prefix: h</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(164.305688 181.643075)">Base + 8 repaired</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(167.271969 193.343175)">latent conditions</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(309.913281 181.643075)">A: three-step</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(297.587438 193.343175)">behavior previews</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(439.949875 181.643075)">F/H: front-view</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(445.39225 193.343175)">joint scoring</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(563.983469 181.643075)">Selected original G</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(576.796625 193.343175)">five full steps</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7b8791" x="607.05" y="113.06268" transform="rotate(-0 607.05 113.06268)">fixed expert bank</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="252.1062" transform="rotate(-0 12.78 252.1062)">Train A from original G behavior; train F/H from actual candidate feedback.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="12.78" y="277.38684" transform="rotate(-0 12.78 277.38684)">Original driving prefix / projector / G stay frozen.  Only the chosen original G branch runs in full.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #425564" x="12.78" y="302.1408" transform="rotate(-0 12.78 302.1408)">Previews are scoring inputs, not executable prefixes.  A fixed S0 probe determines the scene choice for S0-S4.</text>
   </g>
  </g>
 </g>
