# @package _global_

defaults:
  - override /agent: recogdrive_agent

agent:
  cache_hidden_state: false
  train_backbone: true
  last_vla_train_vlm_lora: true
  last_vla_vlm_lora_preset: all_linear
  last_vla_vlm_lora_scope: llm
  last_vla_vlm_lora_r: 64
  last_vla_vlm_lora_alpha: 128
  last_vla_vlm_lora_dropout: 0.05
  last_vla_vlm_lora_use_rslora: true
  last_vla_hidden_anchor_weight: 0.02
  lr_vlm_lora: 5e-6
  lr_last_vla_cot: 1e-4
  use_last_vla: true
  last_vla_stage: cot_alignment
  use_last_rd: false
  last_rd_stage: disabled
  use_expert_features: true
  expert_feature_source: chunk
  use_jepa: true
  use_vggt: true
  jepa_dim: 1024
  vggt_dim: 2048
  num_jepa_tokens: 12
  num_vggt_tokens: 12
  allow_expert_target_features: true
  allow_future_targets_in_inference: false
  last_vla_raw_vlm_context_to_dit: false
  last_vla_cot_bottleneck_mode: true
  last_vla_require_full_geometry: true
  last_vla_allow_patch_geometry_fallback: false
  last_vla_geometry_teacher_dim: 512
  diffusion_loss_weight: 0.0
  last_vla_geometry_loss_weight: 0.5
  last_vla_dynamic_loss_weight: 0.5
  last_vla_coarse_loss_weight: 0.5
  last_vla_heading_loss_weight: 0.1
  last_vla_progress_loss_weight: 0.1
  policy_kd_loss_weight: 0.0
  policy_kd_mode: none
  freeze_base_action_head: true
  train_expert_only: true
  freeze_expert: false

trainer:
  params:
    max_epochs: 10
    strategy: ddp_find_unused_parameters_true
