# @package _global_

defaults:
  - override /agent: recogdrive_agent

cache_path: ${oc.env:CACHE_PATH}
use_cache_without_dataset: true
force_cache_computation: false
cache_train_all_records: true
train_test_split: ${oc.env:TRAIN_TEST_SPLIT}

agent:
  lr: 1e-4
  grpo: false
  stage3_objective: dpsi
  checkpoint_path: ''
  allow_random_init: true
  vlm_path: ${oc.env:RECOGDRIVE_VLM_PATH}
  cam_type: single
  cache_hidden_state: true
  vlm_type: internvl
  dit_type: small
  vlm_size: small
  sampling_method: ddim
  train_backbone: false
  use_expert_features: false
  use_jepa: false
  use_vggt: false
  scheduler_epochs: 200
  scheduler_warmup_epochs: 3
  scheduler_min_lr: 1e-6
  offline_rl_enabled: true
  offline_rl_init_stage3_oracle: false
  offline_rl_init_reference_policy: false
  offline_rl_support_archive_path: ${oc.env:SUPPORT_ARCHIVE_PATH}
  offline_rl_use_dpsi: true
  offline_rl_dpsi_filter_to_support_indices: true
  # The final support archive already filters selected supports for semantic,
  # quality, and feasibility validity. Some selected entries have no category
  # tag, so an empty tag must not become a hard zero-weight target.
  offline_rl_dpsi_empty_tag_zero: false
  offline_rl_dpsi_scene_normalize_weights: true
  offline_rl_dpsi_use_adaptive_beta: true
  # ASMI/DPSI keeps scene-level uniformity but uses a small weighted target set
  # per scene to reduce gradient variance and expose Pareto diversity. This does
  # not flatten supports into dataset items.
  offline_rl_dpsi_target_sample_m: 4
  offline_rl_dpsi_target_sample_m_after_warmup: 4
  offline_rl_dpsi_force_anchor_target: true
  offline_rl_dpsi_force_best_target: true
  # Random-init stability is provided by force_anchor/force_best. Do not warm
  # Pareto support weight from exact zero, otherwise Stage2 degenerates into
  # single-GT imitation during the early epochs.
  offline_rl_dpsi_beta_warmup_epochs: 0
  offline_rl_dpsi_beta_max: 0.75
  # Disable the high-GT saturation shortcut for this run. High-scoring GT scenes
  # still need support diversity so Stage3 starts from a broader policy.
  offline_rl_dpsi_high_gt_reward: 1.1
  offline_rl_dpsi_weight_unknown: 0.55
  offline_rl_dpsi_pairwise_rank_weight: 0.0
  offline_rl_awac_loss_weight: 0.0
  offline_rl_bc_loss_weight: 0.0
  offline_rl_pairwise_rank_loss_weight: 0.0
  offline_rl_invalid_repulsion_loss_weight: 0.0
  offline_rl_preference_dpo_loss_weight: 0.0
  offline_rl_grpo_loss_weight: 0.0
  offline_rl_grpo_buffer_distill_loss_weight: 0.0
  offline_rl_grpo_buffer_preference_dpo_loss_weight: 0.0
  offline_rl_grpo_self_imitation_loss_weight: 0.0
  offline_rl_build_candidates_online: false
  offline_rl_preload_elite_buffer: false
  offline_rl_cache_elite_records_in_memory: false
  offline_rl_require_reference_policy_checkpoint: false

trainer:
  params:
    max_epochs: 200
    devices: 8
    accumulate_grad_batches: 1
    precision: 16-mixed
    limit_train_batches: 1.0
    limit_val_batches: 0
    num_sanity_val_steps: 0

dataloader:
  params:
    batch_size: 16
    num_workers: 8
    pin_memory: false
    prefetch_factor: 2
