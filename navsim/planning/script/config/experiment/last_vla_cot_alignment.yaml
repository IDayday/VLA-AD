# @package _global_

defaults:
  - override /agent: recogdrive_agent

agent:
  use_last_vla: true
  last_vla_stage: cot_alignment
  use_last_rd: false
  last_rd_stage: disabled
  use_expert_features: false
  use_jepa: true
  use_vggt: true
  allow_expert_target_features: true
  allow_future_targets_in_inference: false
  jepa_dim: 1024
  vggt_dim: 2048
  num_jepa_tokens: 128
  num_dynamic_tokens: 128
  num_vggt_tokens: 128
  num_geometry_tokens: 192
  num_risk_tokens: 0
  last_vla_use_risk_head: false
  last_vla_risk_loss_weight: 0.0
  last_vla_vlm_summary_tokens: 64
  last_vla_cot_num_tokens: 192
  last_vla_cot_num_steps: 4
  last_vla_geometry_teacher_dim: 512
  last_vla_geometry_grid_rows: 12
  last_vla_geometry_grid_cols: 16
  last_vla_require_full_geometry: true
  last_vla_allow_patch_geometry_fallback: false
  last_vla_raw_vlm_context_to_dit: false
  last_vla_cot_bottleneck_mode: true
  last_vla_use_residual_diffusion: true
  last_vla_residual_detach_coarse: true
  diffusion_loss_weight: 0.0
  last_vla_geometry_loss_weight: 0.5
  last_vla_dynamic_loss_weight: 0.5
  last_vla_coarse_loss_weight: 0.5
  last_vla_heading_loss_weight: 0.1
  last_vla_progress_loss_weight: 0.1
  last_vla_cot_consistency_loss_weight: 0.05
  policy_kd_loss_weight: 0.0
  policy_kd_mode: none
  freeze_base_action_head: true
  train_expert_only: true
  freeze_expert: false

trainer:
  params:
    max_epochs: 20
    strategy: ddp_find_unused_parameters_true

dataloader:
  params:
    batch_size: 16
