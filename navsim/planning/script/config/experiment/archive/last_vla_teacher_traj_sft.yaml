# @package _global_

defaults:
  - override /agent: recogdrive_agent

agent:
  use_last_vla: true
  last_vla_stage: teacher_traj_sft
  use_last_rd: false
  last_rd_stage: disabled
  use_expert_features: false
  use_jepa: true
  use_vggt: true
  jepa_dim: 1024
  vggt_dim: 2048
  num_jepa_tokens: 12
  num_vggt_tokens: 12
  allow_expert_target_features: true
  last_vla_raw_vlm_context_to_dit: false
  last_vla_cot_bottleneck_mode: true
  last_vla_use_residual_diffusion: true
  last_vla_use_action_conditioned_dynamics: true
  last_vla_teacher_traj_mode: teacher_if_better
  diffusion_loss_weight: 1.0
  last_vla_geometry_loss_weight: 0.1
  last_vla_dynamic_loss_weight: 0.1
  last_vla_coarse_loss_weight: 0.3
  last_vla_heading_loss_weight: 0.05
  last_vla_progress_loss_weight: 0.1
  policy_kd_loss_weight: 0.0
  policy_kd_mode: none

trainer:
  params:
    max_epochs: 100

dataloader:
  params:
    batch_size: 16
