# @package _global_

defaults:
  - override /agent: recogdrive_agent

agent:
  use_two_expert_slots: true
  two_expert_cache_mode: true
  two_expert_slot_mode: vlm_soft_slots
  two_expert_condition_mode: prefuse_cross_attention
  two_expert_dit_condition_mode: prefuse_cross_attention
  dit_dropout: 0.05
  two_expert_planner_dim: 384
  two_expert_use_raw_vlm_base: true
  two_expert_zero_init_deltas: true
  two_expert_memory_tokens_to_dit: false
  two_expert_memory_scale_init: 1.0
  two_expert_prefusion_heads: 8
  two_expert_prefusion_dropout: 0.10
  two_expert_prefusion_token_dropout: 0.05
  two_expert_prefusion_condition_dropout: 0.10
  two_expert_prefusion_scale_init: 1.0
  two_expert_prefusion_zero_init: true
  two_expert_dyn_loss_floor: 0.0
  two_expert_geo_loss_floor: 0.0
  two_expert_num_dyn_groups: 3
  two_expert_dyn_tokens_per_group: 12
  two_expert_num_geo_tokens: 12
  cache_hidden_state: true
  train_backbone: false
  use_last_vla: false
  last_vla_stage: disabled
  use_last_rd: false
  last_rd_stage: disabled
  use_expert_features: false
  diffusion_loss_weight: 1.0
  last_vla_use_residual_diffusion: false
  last_vla_teacher_traj_mode: none
  last_vla_residual_anchor_source: none
  # Simple Stage2: pre-fuse H_dyn/H_geo into raw VLM context before DiT.
  # DiT receives the original context length; no denoise expert branch,
  # no residual diffusion, no Stage3.
  train_expert_only: false
  freeze_base_action_head: false
  freeze_expert: false
  lr: 1e-4
  lr_expert: 1e-4
  lr_action_head: 1e-4
  lr_expert_gate: null
  scheduler_epochs: 200
  scheduler_warmup_epochs: 5
  scheduler_min_lr: 1e-6

trainer:
  params:
    max_epochs: 200
    gradient_clip_val: 1.0
    precision: bf16-mixed

dataloader:
  params:
    batch_size: 16
