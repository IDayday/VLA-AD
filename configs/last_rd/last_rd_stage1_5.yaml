use_expert_features: false
use_jepa: true
use_vggt: true
use_last_rd: true
last_rd_stage: stage1_5

use_future_jepa_prediction: true
use_vggt_geometry_tokens: true
use_ego_trajectory_tokens: true
use_risk_tokens: true
use_scene_aware_expert_gate: true
use_timestep_aware_expert_gate: true

planner_dim: 384
jepa_dim: 1024
vggt_dim: 2048
num_dynamic_tokens: 12
num_geometry_tokens: 12
num_ego_tokens: 8
num_risk_tokens: 8

use_teacher_context_tokens: true
use_student_latent_adapters: true
use_horizon_expert_residual: false
expert_horizon_residual_scale: 0.0

require_vggt_geometry: false
allow_patch_geometry_fallback: true
allow_future_targets_in_inference: false
allow_expert_target_features: true

diffusion_loss_weight: 0.0
expert_alignment_weight: 0.0
jepa_alignment_weight: 0.0
vggt_alignment_weight: 0.0
future_jepa_loss_weight: 0.30
vggt_geometry_loss_weight: 0.10
coarse_traj_loss_weight: 0.50
coarse_heading_loss_weight: 0.10
risk_loss_weight: 0.0
policy_kd_loss_weight: 0.0
policy_kd_mode: none

last_rd_context_scale: 1.0
last_rd_horizon_condition_scale: 1.0
last_rd_token_dropout: 0.0
last_rd_group_dropout: 0.0

freeze_base_action_head: true
train_expert_only: true
freeze_expert: false
epochs: 20
