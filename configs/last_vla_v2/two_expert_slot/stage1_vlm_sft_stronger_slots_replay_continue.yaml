use_two_expert_slot_sft: true
route_name: two_expert_slot_stage1_v2_continue_replay
train_mode: lora
allow_full_vlm_sft: false
init_stage1_checkpoint: required

use_two_expert_slots: true
two_expert_slot_mode: vlm_soft_slots
last_vla_use_residual_diffusion: false
last_vla_teacher_traj_mode: none
train_dit: false
use_action_side_cot: false
use_expert_features: false

num_dyn_groups: 3
num_dyn_tokens_per_group: 12
num_geo_tokens: 12
vggt_feature_dim: null

loss:
  dyn_loss_weight: 1.0
  geo_loss_weight: 1.0
  slot_only_dyn_loss_weight: 0.2
  slot_only_geo_loss_weight: 0.2
  contrastive_dyn_loss_weight: 0.02
  contrastive_geo_loss_weight: 0.02
  contrastive_loss_warmup_fraction: 0.30
  probe_fused_loss_weight: 0.2
  probe_dyn_loss_weight: 0.05
  probe_geo_loss_weight: 0.10
  probe_heading_loss_weight: 0.05
  probe_progress_loss_weight: 0.05
  geo_lateral_profile_loss_weight: 0.05
  geo_heading_profile_loss_weight: 0.05
  recogdrive_replay_ce_loss_weight: 0.1
  replay_ce_loss_warmup_fraction: 0.30
  hidden_anchor_weight: 0.03

adapter:
  image_mask_ratio: 0.7
  image_mask_ratio_start: 0.4
  image_mask_warmup_fraction: 0.25
  image_dropout_prob: 0.25
  image_dropout_prob_start: 0.05
  image_dropout_warmup_fraction: 0.25
  slot_only_use_image_memory: false
  contrastive_temperature: 0.07
  adapter_dim: 384
  loss_type: normalized_mse

replay:
  recogdrive_replay_cache_root: required
  replay_every_n_steps: 2
  replay_source: official
  labels_prompt_masked: true
  max_answer_tokens: 256

optimization:
  lr_vlm: 2e-6
  lr_slots_adapters: 5e-5
  weight_decay: 1e-4
  gradient_clip_val: 1.0
  batch_size_per_gpu: 4
  grad_accum: 2
  max_epochs: 2
  precision: bf16-mixed
  teacher_lru_size: 128
