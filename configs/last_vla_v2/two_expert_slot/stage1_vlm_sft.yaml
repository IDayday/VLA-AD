use_two_expert_slot_sft: true
route_name: two_expert_slot
train_mode: lora
allow_full_vlm_sft: false

use_two_expert_slots: true
two_expert_slot_mode: vlm_soft_slots
two_expert_dit_condition_mode: horizon_hmef_lite
last_vla_use_residual_diffusion: false
last_vla_teacher_traj_mode: none
train_dit: false
use_action_side_cot: false
use_expert_features: false

num_dyn_groups: 3
num_dyn_tokens_per_group: 12
num_geo_tokens: 12

teacher:
  dynamic_teacher_key: jepa_dynamic_teacher_tokens
  geometry_teacher_key: vggt_feature23_tokens
  require_dynamic_teacher: true
  require_geometry_teacher: true

loss:
  dyn_loss_weight: 1.0
  geo_loss_weight: 1.0
  probe_traj_loss_weight: 0.1
  probe_heading_loss_weight: 0.05
  probe_progress_loss_weight: 0.05
  hidden_anchor_weight: 0.05

adapter:
  random_mask_ratio: 0.3
  adapter_dim: 384
  loss_type: normalized_mse

optimization:
  lr_vlm_lora: 1e-5
  lr_slots_adapters: 1e-4
  weight_decay: 1e-4
  gradient_clip_val: 1.0
  batch_size_per_gpu: 2
  grad_accum: 4
  max_epochs: 2
  precision: bf16-mixed
