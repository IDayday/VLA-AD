use_two_expert_slots: true
two_expert_cache_mode: true
two_expert_slot_mode: vlm_soft_slots
two_expert_condition_mode: horizon_hmef_lite
two_expert_dit_condition_mode: horizon_hmef_lite

cache_hidden_state: true
train_backbone: false
use_last_vla: false
last_vla_stage: disabled
use_last_rd: false
last_rd_stage: disabled
use_expert_features: false
raw_vlm_context_to_dit: true
raw_vlm_context_used: true
use_summary: false

diffusion_loss_weight: 1.0
last_vla_use_residual_diffusion: false
last_vla_teacher_traj_mode: none
last_vla_residual_anchor_source: none
two_expert_dyn_loss_floor: 0.0
two_expert_geo_loss_floor: 0.0

two_expert_planner_dim: 384
two_expert_use_raw_vlm_base: true
two_expert_zero_init_deltas: true
two_expert_num_dyn_groups: 3
two_expert_dyn_tokens_per_group: 12
two_expert_num_geo_tokens: 12
planner_dim: 384
sampling_method: ddim
num_inference_steps: 5

stage2_target:
  type: gt_normalized_trajectory
  residual_diffusion: false
  coarse_plus_residual: false
  vlm_text_residual_anchor: false

optimization:
  init_checkpoint: A0 official-aligned step_00100000
  mode: grouped_full_dit_sft
  lr: 3e-5
  lr_action_head: 3e-5
  lr_two_expert_branch: 1e-4
  batch_size_per_gpu: 16
  max_epochs: 20
  scheduler: WarmupCosLR
  warmup_epochs: 2
  min_lr: 1e-6
  gradient_clip_val: 1.0
  precision: bf16-mixed

ablation:
  expert_only_warmup:
    hydra_experiment: two_expert_slot_stage2_expert_only_warmup
    max_epochs: 40
    lr_two_expert_branch: 1e-4
    purpose: diagnostic only; formal run uses grouped_full_dit_sft
