use_bit_drive: true
use_expert_features: false
use_last_rd: false
planner_dim: 384
action_horizon: 8
action_dim: 3
sampling_method: ddim
num_inference_steps: 5
vlm_size: small

bit_use_terminal_head: true
bit_use_path_anchors: true
bit_use_reverse_decoder: true
bit_reverse_decoder_hidden_dim: 384
bit_condition_mode: tokens_and_action
bit_num_path_anchors: 4
bit_path_anchor_indices: [1, 3, 5, 7]

bit_terminal_loss_weight: 0.05
bit_path_loss_weight: 0.05
bit_end_consistency_loss_weight: 0.03
bit_reverse_loss_weight: 0.03
bit_cycle_loss_weight: 0.00

bit_use_gt_condition_prob: 0.50
bit_condition_noise_std: 0.05
bit_condition_dropout: 0.10
bit_fail_if_gt_condition_in_eval: true
bit_log_diagnostics: true
bit_context_condition_strength: 1.0
bit_action_condition_strength: 1.0
bit_learnable_condition_gates: false
bit_detach_condition: false
bit_use_gt_condition_schedule: constant
bit_use_gt_condition_prob_start: 0.50
bit_use_gt_condition_prob_end: 0.50
bit_loss_normalization: raw
bit_enable_terminal_condition: true
bit_enable_path_condition: true
bit_enable_context_tokens: true
bit_enable_action_add: true

failure_sampling_enabled: true
failure_index_path: /mnt/project/VLA-AD/experiments/bit_drive/failure_index/baseline_failure_index.jsonl
failure_weights:
  zero_score: 4.0
  dac_zero: 3.0
  nc_zero: 3.0
  ttc_zero: 2.0
  low_pdms_below_0_5: 2.0
  normal: 1.0

freeze_vlm: true
lr_bit: 1.0e-4
lr_action_head: 2.0e-5
