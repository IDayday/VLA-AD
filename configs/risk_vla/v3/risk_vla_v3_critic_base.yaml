method: risk_vla_v3_trajectory_critic
stage: critic_base
min_real_samples: 10000
candidate_k: 8
model:
  planner_dim: 384
  hidden_dim: 256
  num_risk_classes: 6
training:
  epochs: 80
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  seeds: [0, 1, 2]
  mixed_precision: bf16
loss_weights:
  scene_risk_loss: 1.0
  horizon_risk_loss: 0.25
  submetric_delta_loss: 1.0
  pairwise_preference_loss: 2.0
  constrained_safety_loss: 0.25
  cvar_tail_risk_loss: 0.1
selection_metric: heldout_constrained_utility
leakage_guard:
  forbid_navtest_for_training: true
