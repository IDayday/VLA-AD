candidates:
  max_additional_per_scene: 15
  baseline_and_real_updates_separate: true
  sources:
    own_policy_extra: 4
    released_IL: 1
    smooth_probes: 10
  external_note: Released IL is a separate existing policy; retain its low-score outcomes
    as well.
  smooth_basis: Quadratic elapsed fraction; +/- longitudinal and lateral shifts at
    two fit/cal update scales, +/- heading at larger scale
  amplitude_selection: P50/P90 of per-trajectory RMS actual step4-minus-base coordinate
    differences on fit/cal only; floor0.01m and0.001rad for numerical resolution
  invalid_rejection: Only nonfinite or wrong shape/time/coordinate definition; keep
    collisions/offroad/tracking difficulty
  pairs: At most32 unique unordered pairs per scene, stratified by abs delta <0.02
    or >=0.02 and candidate-source pair; orient both signs by fixed hash; never per-scene
    normalize rewards
  labels: Same canonical PDMS labels for all arms; delta is subtraction, not new truth
  deduplication: Identical float32 whole trajectories within scene share one candidate;
    retain all provenance
