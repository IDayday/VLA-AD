  - 0.0001
  - 0.0003
  - 0.001
  effect_lambda_candidates:
  - 0.25
  - 1.0
  - 4.0
  tuning_rule: FQ/JQ/T select head LR; FE/JE select common lambda by mean relative
    RMSE on D_cal x cal families with fixed head LR3e-4. Three short slots each; then
    lock. No audit access.
  optimizer: AdamW weight_decay0.01, betas0.9/0.999, eps1e-8, grad clip1; constant
    LR
  vlm_lr: 0.0001
  head_lr_effect: 0.0003
  loss_absolute: mean((q-R)^2) over candidates
  loss_difference: mean(((q_a-q_b)-(R_a-R_b))^2) over selected pairs
  frozen_head_capacity: Identical full conditional attention head to joint arms
  joint_encoding: Recompute native VLM forward/backward; verify nonzero LoRA gradients,
    weight changes and shared action feature changes
  primary_eval: D_audit target logs x audit update families, both step1/step4 retained
    within family cluster
  controls:
  - zero prediction
  - trajectory-only T
  - privileged baseline score + trajectory RMS change + ego state linear/ridge diagnostic
  - within-command/speed/trajectory-geometry grouped observation permutation
  privileged_future: false
  metrics:
  - delta_R MAE
  - delta_R RMSE
  - material improvement/drop/near-zero confusion
  - scene-mean degradation PR-AUC
  - top10percent review degradation recall
  - severe-subset RMSE and miss rate
  no_diagnostic_weights_to_RL: true
rl:
  arms:
  - RL-F
  - RL-J
  - RL-Q
  - RL-E
  updates: 500
  save_steps:
  - 0
  - 100
  - 250
  - 500
  global_batch: 8
  group_size: 8
  policy_optimizer: Same AdamW1e-5 as update families
  vlm_lr: 1.0e-05
  objective: Native forward_grpo plus beta times specified auxiliary loss; no reward/sampler/retention
    changes
  beta: 1.0
  lambda_diff: Chosen once in D_cal probe stage
  auxiliary_batch_size: 4
  auxiliary_stream: Same scene/candidate/pair sequence and labels for Q and E
  score_head_initialization: Common FQ frozen-VLM warmup300 steps on D_fit seed41,
    copied to Q/E; no stageD joint weights
  baseline_reset: All policies and LoRA reset to common RL checkpoint and zero adapters
  on_policy: Every arm draws its own native chain from its own current pre-step policy;
    shared scene/noise schedule only
  candidate_gradients: Detached numerical candidates; gradients to score head and
    shared VLM, not through action coordinates
  matched_gain:
    target: 0.002
    tolerance: 0.001
    rule: For each seed and arm choose smallest abs distance to0.002 among registered
      steps with D_cal G in [0.002,0.003]; break ties by earlier step. If absent,
      unmatched, never choose step0.
    audit_gain_requirement: Both arms audit G>0; otherwise no effective-gain advantage
      claim
  same_budget: Compare identical steps, scene exposures and policy scoring budgets;
    include auxiliary scoring cost
  navtest: If development supports H3, evaluate locked matched-gain Q/E checkpoints,
    all12146 scenes, 3 training x5 inference seeds; no retuning
statistics:
  unit: Complete log bootstrap with pooled scene weighting; do not average log means
    equally
  hierarchical: Paired resampling of training seeds, whole logs, inference seed indices;
    update-family clusters resampled for actual-update prediction
  bootstrap_replicates: 2000
  interval: 0.95
  primary_quantities:
  - G=mean(delta_J)
  - M_plus=mean(max(delta_J,0))
  - M_minus=mean(max(-delta_J,0))
  failures:
  - positive->zero
  - high->nearzero
  - new NC/DAC/TTC/comfort/DDC violation
  stable_high: Independent seeds5101..5105 all scores>=0.90; evaluate with1101..1105
  h2_material_relative_rmse_reduction: 0.1
  h3_material_M_minus_reduction: max(0.0005,0.10*RL-Q M_minus)
  low_cluster_caution: Initial cal4 logs and audit3 update families produce limited
    precision; report intervals and INCONCLUSIVE as needed
gates:
  A: All scalar/batch/noise/native-input checks pass; any violation INVALID until
    fixed and affected outputs rebuilt
  B: At least2 held-out families with nonzero parameter/output changes and >=20 material
    scene drops spanning>=4 logs; fewer triggers only registered extension
  D: Real-update held-out prediction improves over zero/T controls and generalizes.
    If JE has no material advantage over JQ with sufficiently narrow interval, stop
    effect-loss route.
  E: Only continue after B and D gates; prediction improvement alone cannot establish
    H3
  decisions:
  - SUPPORTED
  - PARTIALLY_SUPPORTED
  - NOT_SUPPORTED
  - INCONCLUSIVE
  - INVALID
  non_significance: NOT_SUPPORTED only if interval excludes predeclared useful effect
    or stable opposite effect; otherwise INCONCLUSIVE
confirmation_extension:
  max_uses: 1
  triggers:
  - Too few real material drops or reward-diverse source groups
  - 95% comparison interval wider than twice the material-effect threshold
  package: 12 additional independent families (6fit/3cal/3audit) with identical recipe;
    same fixed target splits. Retrain all probe arms with same seeds and2000 updates
    on expanded library. No method-specific expansion.
  severe_recheck: Up to64 severe scenes per audit family selected by deterministic
    hash within log strata;25 additional paired seeds. Included in this single extension
    package.
  no_change_to_architecture_objective_thresholds: true
