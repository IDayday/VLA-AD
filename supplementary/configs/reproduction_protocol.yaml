p1_diagnostics:
  status: proposed_unrun
  launcher: supplementary/launch/run_p1_diagnostics.sh
  suites:
    compatibility_metrics:
      variants: [candidate_to_gt_ade_fde, deterministic_policy_distance, minimum_rollout_bank_distance, average_knn_distance, calibrated_knn]
      matched_acceptance_rate: true
    pcmts_sensitivity:
      rollout_bank_size: [8, 16, 32]
      knn_k: [1, 3, 5]
      calibration_quantile: [0.90, 0.95, 0.975]
      perturbation_count: [4, 8, 16]
      local_feasibility_pass_fraction: [0.625, 0.75, 0.875]
    group_dynamics:
      logging_interval_steps: 25
      evidence: proposed_unrun
      metrics: [all_feasible_rate, mixed_rate, all_infeasible_rate, feasible_rollout_rate, mean_positive_advantage, mean_negative_advantage]
    coherent_reference:
      variants: [ground_truth, current_policy, highest_score_feasible, nearest_safe, no_reference, component_wise_envelope]
    apr_teacher_sources:
      leave_one_out: [historical_policy, grpo_seeds, structured_expansion, safety_specialist, progress_specialist, structure_specialist]
  resources:
    pcmts_and_ffpgrpo_gpu_count: 8
    apr_gpu_count: 4
    gpu_type: A800
    aggregate_wall_clock: not_measured
    aggregate_storage: not_measured

execution_contract:
  current_tree_note: PC-MTS curriculum builders, historical FF-PGRPO credit assignment, and APR teacher builders are not all present in the current checkout
  restore_policy: restore the audited implementation commit or worktree before supplying a command to a launcher
  external_command_environment:
    pcmts: AMPT_PCMTS_COMMAND
    ffpgrpo: AMPT_FFPGRPO_COMMAND
    apr: AMPT_APR_COMMAND
    p1: AMPT_P1_COMMAND
  required_inputs:
    checkpoint_root: AMPT_CHECKPOINT_ROOT
    cache_root: AMPT_CACHE_ROOT
    output_root: AMPT_OUTPUT_ROOT
  safety: launchers refuse execution unless both gates pass and method-specific source checks succeed
